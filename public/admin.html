<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>LensLab Admin</title>
<link rel="icon" href="img/logo-full.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--soft:#f3f3f1;--line:#dcdcd8;--mute:#6b6b68;--bad:#c4281c;--d:'Bricolage Grotesque',system-ui,sans-serif;--b:'Instrument Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 var(--b);color:var(--ink);background:#fff}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--d);letter-spacing:-.03em}
.btn{border:2px solid var(--ink);background:var(--ink);color:#fff;padding:9px 16px;font-weight:600;border-radius:6px}
.btn:hover{background:#fff;color:var(--ink)}.btn.ghost{background:#fff;color:var(--ink)}.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}.btn.red{border-color:var(--bad);background:#fff;color:var(--bad)}.btn.red:hover{background:var(--bad);color:#fff}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid #b9b9b4;border-radius:6px;background:#fff;width:100%}
label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
header img{height:34px}
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
#login{max-width:360px;margin:12vh auto;padding:0 20px;text-align:center}
#login img{height:80px;margin:0 auto 18px}#login input{margin:14px 0}
.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:99px;font-weight:600}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{border:1px solid var(--line);padding:14px;border-radius:6px}
.stat b{font-family:var(--d);font-size:30px;display:block;letter-spacing:-.03em}.stat span{color:var(--mute);font-size:13px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.bar>*{width:auto}.bar input{flex:1;min-width:180px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--mute);font-weight:600}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--ink)}
.badge.confirmed,.badge.completed{background:var(--ink);color:#fff}.badge.cancelled{color:var(--mute);border-color:var(--mute);text-decoration:line-through}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.msg{min-height:20px;font-size:14px;margin:8px 0}.msg.err{color:var(--bad)}
.empty{padding:30px;text-align:center;color:var(--mute)}
@media(max-width:760px){table,thead,tbody,tr,td{display:block}thead{display:none}tr{border:1px solid var(--line);border-radius:6px;margin-bottom:10px;padding:6px}td{border:0;padding:4px 8px}}
</style>
</head>
<body>
<div id="login" hidden>
  <img src="img/logo-full.png" alt="LensLab ILO">
  <h2>Admin</h2>
  <form id="lf"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required><button class="btn" style="width:100%">Log in</button></form>
  <div class="msg err" id="lm"></div>
</div>
<div id="app" hidden>
<header><img src="img/logo-full.png" alt="LensLab ILO"><div><a class="btn ghost sm" href="/" style="text-decoration:none">View site</a> <button class="btn sm" id="out">Log out</button></div></header>
<main>
  <div class="tabs" role="tablist"><button role="tab" data-t="bk" aria-selected="true">Bookings</button><button role="tab" data-t="add" aria-selected="false">Add booking</button><button role="tab" data-t="cm" aria-selected="false">Cameras &amp; prices</button><button role="tab" data-t="bl" aria-selected="false">Blocked dates</button></div>

  <div id="t-bk">
    <div class="stats" id="stats"></div>
    <div class="bar"><input id="q" placeholder="Search name, phone, reference or camera"><select id="fs"><option value="all">All</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><input id="fd" type="date" style="max-width:170px" title="Day in rental"></div>
    <table><thead><tr><th>Ref</th><th>Customer</th><th>Camera</th><th>Dates</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table>
  </div>

  <div id="t-add" hidden><div class="card"><h3 style="margin-bottom:12px">Add a walk-in or Facebook booking</h3>
    <div class="g">
      <div><label>Camera</label><select id="aCam"></select></div>
      <div><label>Start date</label><input id="aDate" type="date"></div>
      <div><label>Days</label><input id="aDays" type="number" min="1" max="14" value="1"></div>
      <div><label>Pickup time</label><select id="aSlot"></select></div>
      <div><label>Name</label><input id="aName"></div>
      <div><label>Mobile</label><input id="aPhone" type="tel"></div>
    </div><div class="msg" id="aMsg"></div><button class="btn" id="aGo">Save booking</button></div></div>

  <div id="t-cm" hidden><div id="camList"></div></div>

  <div id="t-bl" hidden>
    <div class="card"><h3 style="margin-bottom:12px">Block dates</h3><p style="color:var(--mute);margin-bottom:12px">Use for repairs, holidays or when a camera is out. Customers cannot book blocked days.</p>
      <div class="g"><div><label>Camera</label><select id="bCam"></select></div><div><label>From</label><input id="bFrom" type="date"></div><div><label>To</label><input id="bTo" type="date"></div><div><label>Reason</label><input id="bWhy" placeholder="e.g. Repair"></div></div>
      <div class="msg" id="bMsg"></div><button class="btn" id="bGo">Block dates</button></div>
    <div class="card"><h3 style="margin-bottom:8px">Upcoming blocks</h3><div id="bList"></div></div>
  </div>
</main></div>

<script>
const $=s=>document.querySelector(s),peso=n=>'₱'+Number(n||0).toLocaleString('en-PH');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(a,body,q=''){const r=await fetch('/api/admin?action='+a+q,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});let j={};try{j=await r.json()}catch{}if(j.login){showLogin()}return j}
const fd=s=>new Date(s+'T00:00:00Z').toLocaleDateString('en-PH',{timeZone:'UTC',month:'short',day:'numeric'});
let cams=[],slots=[];
function showLogin(){$('#app').hidden=true;$('#login').hidden=false}
async function boot(){const j=await api('me');if(!j.success){showLogin();return}$('#login').hidden=true;$('#app').hidden=false;await loadCams();loadBookings()}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#lm').textContent='';const j=await api('login',{password:$('#pw').value});if(j.success){$('#pw').value='';boot()}else $('#lm').textContent=j.error||'Could not log in.'};
$('#out').onclick=async()=>{await api('logout',{});showLogin()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));['bk','add','cm','bl'].forEach(t=>$('#t-'+t).hidden=t!==b.dataset.t);if(b.dataset.t==='bl')loadBlocks()});
async function loadBookings(){
  const q=new URLSearchParams({q:$('#q').value,status:$('#fs').value,date:$('#fd').value}).toString();
  const j=await api('bookings',null,'&'+q);if(!j.success)return;
  $('#stats').innerHTML=[['Pending',j.counts.pending],['Confirmed',j.counts.confirmed],['Completed',j.counts.completed],['Cancelled',j.counts.cancelled],['Revenue',peso(j.revenue)]].map(([a,b])=>`<div class="stat"><b>${b||0}</b><span>${a}</span></div>`).join('');
  $('#rows').innerHTML=j.bookings.length?j.bookings.map(b=>{
    const A=[];
    if(b.status==='pending')A.push(['confirmed','Confirm','']);
    if(b.status==='confirmed')A.push(['completed','Mark returned','']);
    if(b.status==='pending'||b.status==='confirmed')A.push(['cancelled','Cancel','red']);
    return `<tr><td><b>${esc(b.ref)}</b><br><small style="color:var(--mute)">${esc(b.source)}</small></td><td>${esc(b.name)}<br><a href="tel:${esc(b.phone)}">${esc(b.phone)}</a>${b.facebook?'<br>FB: '+esc(b.facebook):''}${b.notes?'<br><i>'+esc(b.notes)+'</i>':''}</td><td>${esc(b.camera_name)}</td><td>${fd(b.start_date)} to ${fd(b.end_date)}<br><small>${b.days} day${b.days>1?'s':''}, ${esc(b.pickup_label)}</small></td><td>${peso(b.total)}<br><small>+${peso(b.deposit)} deposit</small></td><td><span class="badge ${b.status}">${b.status}</span></td><td><div class="acts">${A.map(a=>`<button class="btn sm ${a[2]||'ghost'}" data-r="${esc(b.ref)}" data-s="${a[0]}">${a[1]}</button>`).join('')}</div></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">No bookings found.</td></tr>';
  document.querySelectorAll('[data-s]').forEach(x=>x.onclick=async()=>{if(x.dataset.s==='cancelled'&&!confirm('Cancel '+x.dataset.r+'? The dates will open up again.'))return;await api('set_status',{ref:x.dataset.r,status:x.dataset.s});loadBookings()});
}
let tm;['q','fs','fd'].forEach(id=>$('#'+id).oninput=()=>{clearTimeout(tm);tm=setTimeout(loadBookings,250)});
async function loadCams(){
  const j=await api('cameras');if(!j.success)return;cams=j.cameras;slots=j.slots;
  const opts=cams.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  $('#aCam').innerHTML=opts;$('#bCam').innerHTML=opts;$('#aSlot').innerHTML=slots.map(s=>`<option value="${s.id}">${esc(s.label)}</option>`).join('');
  $('#camList').innerHTML=cams.map(c=>`<div class="card" data-id="${esc(c.id)}"><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><img src="${esc(c.image)}" alt="" style="width:110px;background:var(--soft)"><h3 style="flex:1">${esc(c.name)}</h3><label style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" class="cAct" style="width:auto" ${c.active?'checked':''}> Shown on site</label></div>
   <div class="g" style="margin-top:14px"><div><label>Name</label><input class="cName" value="${esc(c.name)}"></div><div><label>Price per day (₱)</label><input class="cPrice" type="number" min="0" value="${c.price_per_day}"></div><div><label>Deposit (₱)</label><input class="cDep" type="number" min="0" value="${c.deposit}"></div><div><label>Units you own</label><input class="cUnits" type="number" min="1" max="20" value="${c.units}"></div></div>
   <div style="margin-top:12px"><label>Short description</label><input class="cTag" value="${esc(c.tagline)}"></div>
   <div style="margin-top:12px"><label>What's included (one per line)</label><textarea class="cInc" rows="4">${esc((c.includes||[]).join('\n'))}</textarea></div>
   <div class="msg"></div><button class="btn cSave">Save changes</button></div>`).join('');
  document.querySelectorAll('.cSave').forEach(b=>b.onclick=async()=>{const el=b.closest('.card');const j=await api('save_camera',{id:el.dataset.id,name:el.querySelector('.cName').value,tagline:el.querySelector('.cTag').value,price_per_day:el.querySelector('.cPrice').value,deposit:el.querySelector('.cDep').value,units:el.querySelector('.cUnits').value,active:el.querySelector('.cAct').checked,includes:el.querySelector('.cInc').value.split('\n')});const m=el.querySelector('.msg');m.className='msg'+(j.success?'':' err');m.textContent=j.success?'Saved.':(j.error||'Could not save.')});
}
$('#aGo').onclick=async()=>{const j=await api('add_booking',{camera_id:$('#aCam').value,start_date:$('#aDate').value,days:$('#aDays').value,slot_id:$('#aSlot').value,name:$('#aName').value,phone:$('#aPhone').value});const m=$('#aMsg');m.className='msg'+(j.success?'':' err');m.textContent=j.success?'Saved as '+j.ref+'.':(j.error||'Could not save.');if(j.success)loadBookings()};
async function loadBlocks(){const j=await api('blocks');if(!j.success)return;const seen={};const rows=j.blocks.filter(b=>{const k=b.camera_id+b.date;return seen[k]?false:(seen[k]=1)});
  $('#bList').innerHTML=rows.length?'<table><tbody>'+rows.map(b=>`<tr><td>${esc((cams.find(c=>c.id===b.camera_id)||{}).name||b.camera_id)}</td><td>${fd(b.date)}</td><td>${esc(b.reason)}</td><td><button class="btn sm ghost" data-c="${esc(b.camera_id)}" data-d="${b.date}">Unblock</button></td></tr>`).join('')+'</tbody></table>':'<div class="empty">No blocked dates.</div>';
  document.querySelectorAll('[data-c]').forEach(x=>x.onclick=async()=>{await api('unblock',{camera_id:x.dataset.c,date:x.dataset.d});loadBlocks()})}
$('#bGo').onclick=async()=>{const j=await api('block',{camera_id:$('#bCam').value,from:$('#bFrom').value,to:$('#bTo').value,reason:$('#bWhy').value});const m=$('#bMsg');m.className='msg'+(j.success?'':' err');m.textContent=j.success?j.message:(j.error||'Could not block.');if(j.success)loadBlocks()};
boot();
</script>
</body>
</html>
